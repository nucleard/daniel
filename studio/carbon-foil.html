<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carbon Foil</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@1,600&family=Geist+Mono:wght@400&display=swap">
<style>
  :root { --bg: #050607; --ink: #6d737b; --dim: #3a3f46; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); overflow: hidden;
         font-family: "Geist Mono", ui-monospace, Menlo, Consolas, monospace; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hint { position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
          text-align: center; font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
          color: var(--dim); pointer-events: none; }
  #finish { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: 16px; display: flex; gap: 4px; }
  #finish button { font: inherit; font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
          background: none; border: 1px solid #1c1f24; color: var(--dim); padding: 6px 10px; cursor: pointer; }
  #finish button[aria-pressed="true"] { color: #b7bcc4; border-color: #3a3f46; }
  #finish button:focus-visible { outline: 1px solid #b7bcc4; outline-offset: 2px; }
  #err { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center;
         font-size: 12px; letter-spacing: .1em; line-height: 1.8; }
  #err[data-on] { display: grid; }
  @media (prefers-reduced-motion: reduce) { #hint { display: none; } }
</style>
</head>
<body>
<canvas id="gl" aria-label="Four dark objects: the word IDEAS, a glass disc, a framed photo card, the word CONTACT. Move the pointer near one to tilt it and reveal its sheen."></canvas>
<div id="finish" role="group" aria-label="Finish">
  <button id="f-glass" data-finish="1" aria-pressed="true">Glass</button>
  <button id="f-matte" data-finish="0" aria-pressed="false">Matte</button>
  <button id="f-brushed" data-finish="2" aria-pressed="false">Brushed</button>
</div>
<p id="hint">Move to reveal</p>
<div id="err">Needs WebGL2. Any current browser has it, but the context failed to start here.</div>

<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
precision highp int;

uniform vec2  uRes;
uniform vec2  uTilt[4];
uniform vec2  uPointer[4];
uniform float uHover[4];
uniform int   uFinish;          // 0 matte, 1 glass, 2 brushed
uniform sampler2D uMask;
uniform sampler2D uImage;
out vec4 outColor;

const float DEPTH = 0.075;      // extrusion depth in plane units (letter cap height is ~0.55)
const int   STEPS = 12;

float roundedBox(vec2 p, vec2 halfSize, float radius) {
  vec2 q = abs(p) - halfSize + radius;
  return length(max(q, vec2(0.0))) + min(max(q.x, q.y), 0.0) - radius;
}
float stroke(float d, float width, float aa) { return 1.0 - smoothstep(width, width + aa, abs(d)); }

vec3 wavelengthColor(float w) {
  vec3 r = (vec3(w) - vec3(0.610, 0.545, 0.460)) / vec3(0.045, 0.038, 0.032);
  float visible = smoothstep(0.380, 0.410, w) * (1.0 - smoothstep(0.700, 0.780, w));
  return exp(-0.5 * r * r) * visible;
}
// Reflection grating (GPU Gems ch.8, Stam): grooves run perpendicular to `across`.
vec3 diffraction(vec2 across, vec2 lightAndView, float spacing) {
  float pathDifference = spacing * abs(dot(lightAndView, across));
  float along = dot(lightAndView, vec2(-across.y, across.x));
  float envelope = exp(-along * along / 0.36);
  vec3 reflected = vec3(0.0);
  for (int order = 1; order <= 3; order++) {
    float m = float(order);
    reflected += wavelengthColor(pathDifference / m) / (m * m);
  }
  return reflected * envelope;
}
vec3 pearlColor(float phase) {
  return vec3(0.55, 0.52, 0.64) + vec3(0.43, 0.40, 0.34) * cos(6.2831853 * (phase + vec3(0.05, 0.38, 0.63)));
}
float hash(vec2 point, float freq) {
  uvec2 p = uvec2(abs(point) * freq + 7.0);
  uint n = (p.x * 1597334677u) ^ (p.y * 3812015801u);
  n = (n ^ (n >> 16u)) * 2246822519u;
  return float(n & 1023u) / 1023.0 - 0.5;
}

// Atlas: four 1024px squares, each mapping its quadrant's plane [-1,1]^2. R crisp, G blurred.
vec2 maskAt(int qi, vec2 p) {
  vec2 local = clamp(p * 0.5 + 0.5, 0.0, 1.0);
  vec2 atlasUv = vec2(qi == 0 ? 0.0 : 0.5, qi == 0 ? 0.5 : 0.0) + local * 0.5;
  return texture(uMask, atlasUv).rg;
}
// Top-face coverage of each quadrant's object at plane point p.
float coverage(int qi, vec2 p, vec2 half_, float aa) {
  if (qi == 0 || qi == 3) return maskAt(qi, p).r;
  if (qi == 1) return 1.0 - smoothstep(-aa, aa, length(p) - half_.x);
  return 1.0 - smoothstep(-aa, aa, roundedBox(p, half_, 0.05));
}
// Outward direction of the object's edge at p, from finite differences of coverage.
vec2 edgeNormal(int qi, vec2 p, vec2 half_, float aa) {
  float e = 0.006;
  vec2 g = vec2(coverage(qi, p + vec2(e, 0.0), half_, aa) - coverage(qi, p - vec2(e, 0.0), half_, aa),
                coverage(qi, p + vec2(0.0, e), half_, aa) - coverage(qi, p - vec2(0.0, e), half_, aa));
  return -g / max(length(g), 1e-5);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  int qx = uv.x < 0.5 ? 0 : 1;
  int qy = uv.y < 0.5 ? 1 : 0;
  int qi = qy * 2 + qx;
  vec2 quv = fract(uv * 2.0);
  vec2 qres = uRes * 0.5;
  float scale = min(qres.y, qres.x * 1.35);
  vec2 screen = (quv - 0.5) * qres / scale * 2.2;

  vec2 tilt = uTilt[qi];
  vec2 pointer = uPointer[qi];
  float hover = clamp(uHover[qi], 0.0, 1.0);
  int f = uFinish;

  // Tilted plane; every pixel is a ray hit on it.
  float sx = sin(tilt.y), cx = cos(tilt.y), sy = sin(tilt.x), cy = cos(tilt.x);
  vec3 right = vec3(cy, 0.0, -sy);
  vec3 up = vec3(sy * sx, cx, cy * sx);
  vec3 normal = cross(right, up);
  vec3 eye = vec3(0.0, 0.0, 4.5);
  vec3 ray = normalize(vec3(screen, -4.5));
  vec3 hit = eye - ray * (dot(eye, normal) / dot(ray, normal));
  vec2 p = vec2(dot(hit, right), dot(hit, up));
  float aa = max(length(fwidth(p)), 0.0006);
  // Where the same ray lands on a surface d below the top face: p + perDepth * d.
  vec2 perDepth = vec2(dot(ray, right), dot(ray, up)) / abs(dot(ray, normal));

  vec2 half_ = qi == 0 ? vec2(0.86, 0.34) : qi == 1 ? vec2(0.72) : qi == 2 ? vec2(0.62, 0.80) : vec2(0.86, 0.30);

  // Grazing light following the pointer.
  vec2 lightCenter = pointer * half_;
  vec2 delta = p - lightCenter;
  float sweep = delta.x * 0.72 + delta.y * 0.52 + sin(p.y * 4.0 + p.x * 3.0) * 0.08;
  float lightBand = exp(-(sweep / 0.36) * (sweep / 0.36));
  float glint = exp(-(sweep / 0.085) * (sweep / 0.085));
  vec2 dd = delta * vec2(1.05, 0.72);
  float spotlight = exp(-dot(dd, dd) * 2.6);
  float light = lightBand * spotlight * hover;
  vec3 L = normalize(vec3(lightCenter, 1.2) - hit);
  vec3 V = normalize(eye - hit);
  vec3 LV3 = L + V;
  vec2 LV = vec2(dot(LV3, right), dot(LV3, up));
  vec3 H = normalize(vec3(LV, dot(LV3, normal)));           // half vector in plane basis
  vec3 Vp = vec3(dot(V, right), dot(V, up), dot(V, normal));
  vec3 Lp = vec3(dot(L, right), dot(L, up), dot(L, normal));
  float illumination = max(dot(normal, L), 0.0) * max(dot(normal, V), 0.0);
  vec3 tint = vec3(0.72, 0.76, 0.80);
  float pearlPhase = dot(LV, vec2(0.48, -0.32)) + p.y * 0.32;

  // Finish parameters.
  float grainAmt = f == 0 ? 0.050 : f == 1 ? 0.007 : 0.018;
  float specPow  = f == 0 ? 10.0  : f == 1 ? 160.0 : 48.0;
  float specAmt  = f == 0 ? 0.10  : f == 1 ? 1.15  : 0.45;
  float pearlAmt = f == 0 ? 0.12  : f == 1 ? 0.30  : 0.22;
  float fresAmt  = f == 0 ? 0.10  : f == 1 ? 0.55  : 0.22;

  vec3 background = vec3(0.012, 0.013, 0.016) + 0.006 * exp(-dot(screen, screen) * 0.8) * (0.5 + hover);
  float shadow = qi == 1 ? exp(-max(length(screen - vec2(0.03, -0.06)) - half_.x, 0.0) * 22.0)
               : qi == 2 ? exp(-max(roundedBox(screen - vec2(0.025, -0.06), half_, 0.05), 0.0) * 22.0) : 0.0;
  background *= 1.0 - 0.65 * shadow;

  // Top face and extruded side.
  float top = coverage(qi, p, half_, aa);
  float side = 0.0, sideDepth = 0.0;
  vec2 sideP = p;
  if (top < 0.5) {
    for (int i = 1; i <= STEPS; i++) {
      float d = DEPTH * float(i) / float(STEPS);
      vec2 pd = p + perDepth * d;
      float c = coverage(qi, pd, half_, aa);
      if (c > 0.5) { side = c; sideDepth = d; sideP = pd; break; }
    }
  }

  // Surface normal of the top face, in plane basis.
  vec3 N = vec3(0.0, 0.0, 1.0);
  vec2 m = vec2(0.0);
  float rimShape = 0.0;
  if (qi == 0 || qi == 3) {
    m = maskAt(qi, p);
    vec2 g = vec2(dFdx(m.g), dFdy(m.g));
    N = normalize(vec3(-g * 7.0, 1.0));
    rimShape = smoothstep(0.0, 0.5, m.g) * (1.0 - smoothstep(0.5, 1.0, m.g));
  } else if (qi == 1) {
    float r = length(p);
    float rim = smoothstep(half_.x - 0.09, half_.x, r);
    vec2 rad = r > 1e-4 ? p / r : vec2(1.0, 0.0);
    N = normalize(vec3(rad * rim * 0.9, 1.0));
    rimShape = rim;
  }

  // Shared material on the top face.
  float noise = f == 2 ? hash(vec2(p.x * 0.012, p.y), 2400.0) : hash(p, 2400.0);
  vec3 c = vec3(0.062, 0.068, 0.078) + 0.008 * (0.9 - p.y);
  c += noise * grainAmt * (1.0 + light * 2.5);
  c += light * (vec3(0.04) + tint * 0.05);
  vec3 pearl = pearlColor(pearlPhase + N.x * 0.35 + N.y * 0.25);
  c += pearl * light * pearlAmt;
  c += (pearl * 0.5 + vec3(0.5)) * glint * spotlight * hover * 0.10;
  float ndh = max(dot(N, H), 0.0);
  float spec = pow(ndh, specPow);
  float fres = pow(1.0 - max(dot(N, Vp), 0.0), 4.0);
  c += (vec3(0.88, 0.90, 0.94) + pearl * 0.2) * spec * specAmt * (0.12 + light * 0.9);
  c += (pearl * 0.45 + vec3(0.25)) * fres * fresAmt * (0.35 + light * 0.9);
  if (f == 2) {
    // Anisotropic hairline: highlight stretches along the grooves, rainbow across them.
    vec2 across = qi == 1 ? (length(p) > 1e-4 ? p / length(p) : vec2(1.0, 0.0)) : vec2(0.0, 1.0);
    float aniso = exp(-dot(H.xy, across) * dot(H.xy, across) * 260.0) * exp(-dot(H.xy, vec2(-across.y, across.x)) * dot(H.xy, vec2(-across.y, across.x)) * 6.0);
    c += (vec3(0.7, 0.72, 0.76) + pearl * 0.3) * aniso * (0.10 + light * 0.9) * 0.5;
    c += diffraction(across, LV, 1.6) * illumination * (0.25 + light * 1.2) * hover * 0.7;
  } else if (f == 1 && qi == 1) {
    // Glass disc keeps a faint radial rainbow inside the dome.
    vec2 rad = length(p) > 1e-4 ? p / length(p) : vec2(1.0, 0.0);
    c += diffraction(rad, LV, 1.55) * illumination * light * 0.5 * (1.0 - rimShape);
  }
  float sparkle = pow(max(noise + 0.5, 0.0), 24.0) * glint * spotlight * hover;
  c += pearl * sparkle * (f == 0 ? 0.10 : 0.20);
  // Bevel and dome edges read even at rest.
  c += vec3(0.16, 0.18, 0.21) * rimShape * (0.30 + light * 0.4);
  if (qi == 0 || qi == 3) c += (vec3(0.85, 0.88, 0.92) + pearl * 0.3) * spec * specAmt * rimShape * (0.10 + light * 0.8);

  if (qi == 1) {
    float r = length(p);
    float hub = 1.0 - smoothstep(0.12, 0.125, r);
    c = mix(c, vec3(0.045, 0.05, 0.058) + vec3(0.2) * spec * specAmt, hub);
    c = mix(c, vec3(0.30, 0.33, 0.37) + pearl * light * 0.3, stroke(r - 0.125, 0.0012, aa));
  }
  if (qi == 2) {
    // Photo under glass inside the frame.
    float frame = 0.13;
    vec2 innerHalf = half_ - frame;
    float innerEdge = roundedBox(p, innerHalf, 0.012);
    float inside = 1.0 - smoothstep(-aa, aa, innerEdge);
    vec2 imgUv = clamp(p / innerHalf * 0.5 + 0.5, 0.0, 1.0);
    vec3 photo = texture(uImage, imgUv).rgb;
    float glare = pow(max(dot(N, H), 0.0), 12.0);
    vec3 pr = photo * (0.78 + 0.45 * light + 0.06 * hover);
    pr += (vec3(0.6) + pearl * 0.4) * glint * spotlight * hover * (f == 0 ? 0.06 : 0.16);
    pr += vec3(0.5, 0.52, 0.56) * glare * light * (f == 0 ? 0.08 : 0.28);
    pr += (pearl * 0.3 + vec3(0.2)) * fres * fresAmt * 0.5;
    c = mix(c, pr, inside);
    c = mix(c, vec3(0.25, 0.28, 0.32) + pearl * light * 0.5, stroke(innerEdge + 0.004, 0.0009, aa * 0.7));
  }

  // Extruded side face: darker carbon, lit by the same light, occluded with depth.
  vec2 n2 = edgeNormal(qi, sideP, half_, aa);
  vec3 sideN = vec3(n2, 0.0);
  float lambert = max(dot(sideN, normalize(Lp)), 0.0);
  float sideSpec = pow(max(dot(sideN, H), 0.0), f == 1 ? 60.0 : 14.0);
  vec3 sc = vec3(0.030, 0.034, 0.040) * (0.5 + 0.5 * (1.0 - sideDepth / DEPTH));
  sc += vec3(0.10, 0.11, 0.13) * lambert * (0.25 + light * 0.75);
  sc += (vec3(0.6) + pearl * 0.4) * sideSpec * specAmt * 0.35 * (0.2 + light);
  sc += noise * grainAmt * 0.5;

  // Rim line around the top face.
  float rimLine = 0.0;
  if (qi == 1) rimLine = stroke(length(p) - half_.x + 0.002, 0.0009, aa * 0.7);
  if (qi == 2) rimLine = stroke(roundedBox(p, half_, 0.05) + 0.002, 0.0008, aa * 0.7);
  float rimLight = pow(max(0.0, 1.0 - length(delta) * 0.65), 3.0) * hover;
  c = mix(c, vec3(0.25, 0.28, 0.32) + (pearl * 0.7 + tint * 0.3) * rimLight * 0.6, rimLine);

  vec3 color = mix(background, sc, side * (1.0 - top));
  color = mix(color, c, top);
  outColor = vec4(color, 1.0);
}
</script>

    const m = actx.measureText(word);
    const size = Math.floor(200 * targetW / Math.max(1, m.width));
    actx.font = `${size}px ${font}`;
    const mm = actx.measureText(word);
    const yoff = (mm.actualBoundingBoxAscent - mm.actualBoundingBoxDescent) / 2;
    actx.textAlign = 'center'; actx.textBaseline = 'alphabetic';
    actx.globalCompositeOperation = 'lighter';
    actx.filter = 'blur(9px)'; actx.fillStyle = '#00ff00'; actx.fillText(word, cx, cy + yoff);
    actx.filter = 'none';      actx.fillStyle = '#ff0000'; actx.fillText(word, cx, cy + yoff);
    actx.globalCompositeOperation = 'source-over';
  };
  const buildAtlas = () => {
    actx.fillStyle = '#000'; actx.fillRect(0, 0, atlas.width, atlas.height);
    drawWord('IDEAS', '"Bebas Neue", Impact, "Arial Narrow Bold", sans-serif', CELL * 0.5, CELL * 0.5, CELL * 0.86);
    drawWord('CONTACT', 'italic 600 "Cormorant Garamond", "Times New Roman", serif', CELL * 1.5, CELL * 1.5, CELL * 0.86);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, maskTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, atlas);
    gl.generateMipmap(gl.TEXTURE_2D);
  };
  buildAtlas();
  const fontsReady = document.fonts ? Promise.all([
    document.fonts.load('200px "Bebas Neue"'),
    document.fonts.load('italic 600 200px "Cormorant Garamond"'),
  ]).catch(() => {}) : Promise.resolve();
  fontsReady.then(buildAtlas);

  // Photo, pre-cropped to the inner frame's aspect.
  const img = new Image();
  img.onload = () => {
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, imgTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
    gl.generateMipmap(gl.TEXTURE_2D);
  };
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, imgTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, 1, 1, 0, gl.RGB, gl.UNSIGNED_BYTE, new Uint8Array([20, 22, 26]));
  img.src = 'data:image/jpeg;base64,' + IMAGE_B64;

  // Per-quadrant interaction state (mirrors the shader's plane coordinates).
  const HALF = [[0.86, 0.34], [0.72, 0.72], [0.62, 0.80], [0.86, 0.30]];
  const q = [0, 1, 2, 3].map(() => ({ pointerX: 0, pointerY: 0, target: 0, hover: 0, tiltX: 0, tiltY: 0, lightX: 0.2, lightY: 0.25 }));
  const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const dprCap = Math.max(0.1, Math.min(2, parseFloat(params.get('dpr')) || 2));
  const demo = params.has('demo');   // ?demo=1 lights every quadrant, for stills
  const TILT_X = 0.26, TILT_Y = 0.20;  // radians at full deflection; deep enough to show the sides
  let W = 1, H = 1, dpr = 1;
  const resize = () => {
    dpr = Math.min(dprCap, window.devicePixelRatio || 1);
    W = Math.max(1, Math.floor(canvas.clientWidth * dpr));
    H = Math.max(1, Math.floor(canvas.clientHeight * dpr));
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    gl.viewport(0, 0, W, H);
    gl.uniform2f(uRes, W, H);
  };
  new ResizeObserver(resize).observe(canvas);
  resize();

  const move = (e) => {
    if (!e.isPrimary) return;
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    const qx = x < 0.5 ? 0 : 1, qy = y < 0.5 ? 0 : 1, qi = qy * 2 + qx;
    const qw = r.width / 2, qh = r.height / 2;
    const scale = Math.min(qh, qw * 1.35);
    const sxp = ((x * 2 - qx) - 0.5) * qw / scale * 2.2;
    const syp = -((y * 2 - qy) - 0.5) * qh / scale * 2.2;
    for (let i = 0; i < 4; i++) {
      if (i !== qi) { q[i].target = 0; continue; }
      const s = q[i], h = HALF[i];
      s.pointerX = sxp / h[0]; s.pointerY = syp / h[1];
      const dX = Math.max(0, Math.abs(s.pointerX) - 1) * h[0];
      const dY = Math.max(0, Math.abs(s.pointerY) - 1) * h[1];
      const prox = Math.max(0, 1 - Math.hypot(dX, dY) / 1.1);
      s.target = prox * prox * (3 - 2 * prox);
    }
  };
  const leave = () => q.forEach(s => { s.target = 0; });
  canvas.addEventListener('pointermove', move, { passive: true });
  canvas.addEventListener('pointerdown', move, { passive: true });
  canvas.addEventListener('pointerleave', leave);
  canvas.addEventListener('pointercancel', leave);
  canvas.addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') leave(); });

  const tilt = new Float32Array(8), pointer = new Float32Array(8), hover = new Float32Array(4);
  let last = performance.now();
  const frame = (now) => {
    const dt = Math.min((now - last) / 1000, 0.1); last = now;
    const blend = motion.matches ? 1 : 1 - Math.exp(-10 * dt);
    for (let i = 0; i < 4; i++) {
      const s = q[i];
      if (demo && s.target === 0) { s.target = 1; s.pointerX = 0.35; s.pointerY = 0.25; }
      const cl = v => Math.max(-1, Math.min(1, v));
      const tx = motion.matches ? 0 : cl(s.pointerX) * TILT_X * s.target;
      const ty = motion.matches ? 0 : cl(s.pointerY) * TILT_Y * s.target;
      s.tiltX += (tx - s.tiltX) * blend;
      s.tiltY += (ty - s.tiltY) * blend;
      s.hover += (s.target - s.hover) * blend;
      if (s.target > 0) { s.lightX += (s.pointerX - s.lightX) * blend; s.lightY += (s.pointerY - s.lightY) * blend; }
      tilt[i * 2] = s.tiltX; tilt[i * 2 + 1] = s.tiltY;
      pointer[i * 2] = s.lightX; pointer[i * 2 + 1] = s.lightY;
      hover[i] = s.hover;
    }
    gl.uniform2fv(uTilt, tilt); gl.uniform2fv(uPointer, pointer); gl.uniform1fv(uHover, hover);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
