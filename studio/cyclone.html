<!doctype html>
<meta charset="utf-8">
<title>shader</title>
<style>html,body{margin:0;height:100%;background:#000}canvas{width:100%;height:100%;display:block}</style>
<canvas id="c"></canvas>

<!-- Paste a FragCoord.xyz-dialect shader here (main() + u_resolution/u_time/u_mouse). -->
<script id="frag" type="x-shader/x-fragment">
// Original: https://fragcoord.xyz/s/3zoe0vgo
f z, d, a
@(90)
{
    f3 p = z * nor(2*C.rgb - R.xyy),t
    p.z+=9,t=p
    a=(p.y-len(p.xz))/2
    p.xz*=m2(cos(a+f4(,5,8,)))
    d=2;@(7)d/=.9,
        p += sin(p.yzx * d - f3(T,,)*6) / d
    z += d = min(len(p.xz),8-abs(p.y)) / 15/(2+cos(a-T))
    O += f4(7,5,z,)*d/len(t.xz+(p.xz/2+3)*sin(T-a))
}
O = tanh(O*O / 1e3)
</script>

<script>
// Minimal WebGL2 host: same three layers as run.py, with the browser as the host program.
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2");
if (!gl) document.body.textContent = "WebGL2 not available";

const HEADER = `#version 300 es
precision highp float;
uniform float u_time; uniform vec2 u_mouse;
out vec4 fragColor;
#define gl_FragColor fragColor
`;
let body = document.getElementById("frag").textContent;
if (!/uniform\s+vec2\s+u_resolution/.test(body)) body = "uniform vec2 u_resolution;\n" + body;
const VERT = `#version 300 es
in vec2 v; void main(){ gl_Position = vec4(v, 0.0, 1.0); }`;

function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, HEADER + body));
gl.linkProgram(prog); gl.useProgram(prog);

const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, "v"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const uRes = gl.getUniformLocation(prog, "u_resolution"), uTime = gl.getUniformLocation(prog, "u_time"), uMouse = gl.getUniformLocation(prog, "u_mouse");

let mouse = [0, 0];
canvas.addEventListener("mousemove", e => { mouse = [e.clientX * devicePixelRatio, canvas.height - e.clientY * devicePixelRatio]; });
const t0 = performance.now();
function frame() {
  const w = Math.floor(canvas.clientWidth * devicePixelRatio), h = Math.floor(canvas.clientHeight * devicePixelRatio);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
  gl.uniform2f(uRes, w, h); gl.uniform1f(uTime, (performance.now() - t0) / 1000); gl.uniform2f(uMouse, mouse[0], mouse[1]);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}
frame();
</script>
